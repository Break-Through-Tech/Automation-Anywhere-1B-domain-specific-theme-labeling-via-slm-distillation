checkpoints:
  clustered_file: bitext_clustered.csv
  embeddings_file: phase1_embeddings.pkl
  umap_file: phase1_umap.pkl
  use_checkpoints: false
clustering:
  embedding_model: all-MiniLM-L6-v2
  hdbscan:
    cluster_selection_method: eom
    metric: euclidean
    min_cluster_size: 10
    min_samples: 5
  umap:
    metric: cosine
    min_dist: 0.0
    n_components: 20
    n_neighbors: 15
    random_state: 42
colab:
  drive_root_override: /content/drive/MyDrive/slm-distillation
  mount_drive: false
dataset:
  domain: IT
  it_categories:
  - ACCOUNT
  - TECHNICAL_SUPPORT
  - DELIVERY
  - CONTACT
  label_column: category
  n_samples: 500
  name: /content/drive/MyDrive/slm-distillation/data/cleaned/bitext_cleaned_support.csv
  text_column: instruction
device_mode: colab
evaluation:
  bertscore_model: roberta-large
  business:
    measure_finetuning_time: true
    measure_inference_latency: true
    measure_label_generation_latency: true
    n_inference_warmup_runs: 3
  embedding_model: all-mpnet-base-v2
  existing_run_dir: null
  judge_llm:
    model: claude-haiku-4-5
    n_samples: 50
    provider: anthropic
    temperature: 0.0
  judge_mode: reference
  run_bertscore: false
lora:
  bias: none
  lora_alpha: 32
  lora_dropout: 0.05
  r: 32
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  task_type: CAUSAL_LM
paths:
  checkpoints: /content/drive/MyDrive/slm-distillation/runs/llama_3.2_3b_ogprompt/checkpoints_clean
  data_processed: '{drive_root}/data/processed_clean_ogprompt'
  data_raw: '{drive_root}/data/raw'
  drive_root: /content/drive/MyDrive/slm-distillation
  evaluation_out: /content/drive/MyDrive/slm-distillation/runs/llama_3.2_3b_ogprompt/outputs_clean/evaluation
  hf_cache: /root/.cache/huggingface
  labels_out: /content/drive/MyDrive/slm-distillation/runs/llama_3.2_3b_ogprompt/outputs_clean/labels
  models_out: /content/drive/MyDrive/slm-distillation/runs/llama_3.2_3b_ogprompt/outputs_clean/models
  outputs: /content/drive/MyDrive/slm-distillation/runs/llama_3.2_3b_ogprompt/outputs_clean
pipeline:
  run_baseline_eval: true
  run_business_eval: true
  run_clustering: true
  run_finetuned_eval: true
  run_finetuning: true
  run_label_generation: true
  run_llm_judge: true
  run_preprocessing: true
prompts:
  P1: 'Generate a concise label (5-15 words) for this cluster of support tickets.


    {tickets}'
  P2: 'What is the primary issue described in these support tickets? Answer in one
    short phrase.


    {tickets}'
  P3: 'Name this cluster as it would appear as a category in an IT support knowledge
    base.


    {tickets}'
  P4: 'Describe the common theme unifying these support tickets in 5-15 words.


    {tickets}'
  P5: 'Generate a label for this cluster that would help a chatbot route similar requests
    correctly.


    {tickets}'
  include_domain_in_prompt: false
  system: "You are an expert at analyzing IT, HR, and customer experience support\
    \ tickets. Your task is to generate a concise, descriptive label for a cluster\
    \ of support tickets. The label should capture the dominant theme, be specific\
    \ enough to distinguish this cluster from others, and be 5-15 words long. Return\
    \ only the label \u2014 no explanation, no punctuation at the end, no quotes.\n"
qlora:
  bnb_4bit_quant_type: nf4
  load_in_4bit: true
  use_double_quant: true
seed: 42
split:
  test: 0.15
  train: 0.7
  val: 0.15
student_slm:
  max_seq_length: 1024
  model_id: meta-llama/Llama-3.2-3B-Instruct
teacher_llm:
  max_retries: 5
  max_tokens: 60
  model: claude-haiku-4-5
  provider: anthropic
  retry_wait_max: 60
  retry_wait_min: 2
  sleep_between_calls: 1.0
  temperature: 0.3
top_k: 10
training:
  bf16: false
  eval_strategy: epoch
  fp16: true
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0004
  load_best_model_at_end: true
  logging_steps: 5
  lr_scheduler_type: cosine
  metric_for_best_model: eval_loss
  num_train_epochs: 4
  output_dir: '{paths.models_out}/lora_adapter'
  per_device_train_batch_size: 2
  save_strategy: epoch
  warmup_ratio: 0.05
